name: CI — Event Service

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "event-service/**"
      - ".github/workflows/ci-event-service.yml"
      - ".github/workflows/ci-template.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "event-service/**"
      - ".github/workflows/ci-event-service.yml"
      - ".github/workflows/ci-template.yml"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci-template.yml
    with:
      service-name: new_ticket-event-service
      service-path: ./event-service
      runtime: node
      node-version: "18"
      environment: ${{ github.ref_name }}
    secrets: inherit
