name: CI — Chatbot Service

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "chatbot-service/**"
      - ".github/workflows/ci-chatbot-service.yml"
      - ".github/workflows/ci-template.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "chatbot-service/**"
      - ".github/workflows/ci-chatbot-service.yml"
      - ".github/workflows/ci-template.yml"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci-template.yml
    with:
      service-name: new_ticket-chatbot-service
      service-path: ./chatbot-service
      runtime: node
      node-version: "18"
      environment: ${{ github.ref_name }}
      sonar-enabled: false
      notifications-enabled: false
    secrets: inherit
