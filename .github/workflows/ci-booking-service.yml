name: CI — Booking Service

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "booking-service/**"
      - ".github/workflows/ci-booking-service.yml"
      - ".github/workflows/ci-template.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "booking-service/**"
      - ".github/workflows/ci-booking-service.yml"
      - ".github/workflows/ci-template.yml"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci-template.yml
    with:
      service-name: new_ticket-booking-service
      service-path: ./booking-service
      runtime: node
      node-version: "18"
      environment: ${{ github.ref_name }}
      sonar-enabled: false
      notifications-enabled: false
    secrets: inherit
