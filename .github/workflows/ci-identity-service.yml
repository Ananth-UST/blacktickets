name: CI — Identity Service

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "identity-service/**"
      - ".github/workflows/ci-identity-service.yml"
      - ".github/workflows/ci-template.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "identity-service/**"
      - ".github/workflows/ci-identity-service.yml"
      - ".github/workflows/ci-template.yml"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci-template.yml
    with:
      service-name: new_ticket-identity-service
      service-path: ./identity-service
      runtime: node
      node-version: "18"
      environment: ${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
      sonar-enabled: true
      notifications-enabled: false
      sonar-project-key: new-ticket-identity-service
    secrets: inherit
